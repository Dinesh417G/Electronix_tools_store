# Release pipeline. Deliberately the same shape as electronix-dnc's release.yml:
# a version tag builds the artifacts and publishes a DRAFT release to a PUBLIC
# releases repo. Flipping the draft to published — one tap from a phone — is the
# staging gate, so nothing reaches a shop floor without a human deciding it
# should.
#
# The version model is DNC's, unchanged and worth restating: **the tag is only
# the TRIGGER; the committed manifest is the truth.** This workflow refuses to
# run if the tag does not already equal the version in Cargo.toml. CI never
# mutates versions.
#
# Both platforms are built. §3 puts the server PC inside the plant, and in this
# shop that PC runs Windows — but the same binary is useful on a Linux box, and
# building both costs one extra runner.
#
# Two OTA channels come out of this, and they are very different animals:
#
#   store-server   a binary on the store's server PC. Updated the DNC way:
#                  sha256-verified download, atomic swap, `.old` kept for a
#                  one-minute rollback. `store-cli update` does it.
#
#   web terminal   every phone and tablet in the shop. Updated by *being served
#                  a new bundle* — the service worker notices and offers a
#                  reload. There is no signing key to lose and nothing to
#                  install, which is the single biggest reason the terminal is
#                  a web app rather than an APK.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   RELEASES_REPO_TOKEN   fine-grained PAT for the public releases repo
#                         (Contents: RW). The default GITHUB_TOKEN cannot
#                         create releases on another repository.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (x.y.z, no leading v) — must equal the version already committed in Cargo.toml"
        required: true
        type: string
      publish_immediately:
        description: "Publish immediately instead of leaving the release a draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, and NEVER cancel one that is half-published.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: Dinesh417G/electronix-tool-store-releases
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. The version is the committed one, or nothing happens ───────────
  version:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            v="${INPUT_VERSION#v}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be plain semver x.y.z (got '$v')."
            exit 1
          fi

          # The tag is the trigger; the manifest is the truth.
          committed=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$committed" != "$v" ]; then
            echo "::error::Tag v$v does not match the version committed in Cargo.toml ($committed). Bump the manifest and commit it first — this pipeline never mutates versions."
            exit 1
          fi

          web=$(node -p "require('./crates/store-web/package.json').version")
          if [ "$web" != "$v" ]; then
            echo "::error::crates/store-web/package.json is $web, expected $v."
            exit 1
          fi

          echo "version=$v" >> "$GITHUB_OUTPUT"

  # ── 2. The web terminal, built once and shared ────────────────────────
  web:
    name: web terminal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: version
    steps:
      - uses: actions/checkout@v5
      # 22, matching ci.yml. 20 is end-of-life since April 2026, and a release
      # is the last place to build on a runtime nobody is patching.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/store-web/package-lock.json
      - run: npm ci
        working-directory: crates/store-web
      - run: npm run build
        working-directory: crates/store-web
      - uses: actions/upload-artifact@v7
        with:
          name: store-web-dist
          path: crates/store-web/dist
          retention-days: 1

  # ── 3. The gate. A release that skips this is one nobody can vouch for ─
  test:
    name: test gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: electronix_store
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/electronix_store
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - uses: actions/download-artifact@v8
        with:
          name: store-web-dist
          path: crates/store-web/dist

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked
      - name: Run migrations
        run: sqlx migrate run --source crates/store-db/migrations

      - name: cargo test
        run: cargo test --workspace --all-targets --all-features
      - name: Lint gate
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── 4. Binaries, per platform ─────────────────────────────────────────
  build:
    name: build (${{ matrix.platform }})
    needs: [version, test]
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            server: target/release/store-server
            cli: target/release/store-cli
          - os: windows-latest
            platform: windows-x86_64
            server: target/release/store-server.exe
            cli: target/release/store-cli.exe
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.platform }}
          cache-on-failure: true
      - uses: actions/download-artifact@v8
        with:
          name: store-web-dist
          path: crates/store-web/dist

      - name: Build
        env:
          # Makes a rebuild of the same commit byte-identical, which is what
          # makes the sha256 in the manifest worth checking.
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
        run: cargo build --release -p store-server -p store-cli

      - name: Stage
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p staged
          ext=""
          if [ "${PLATFORM%%-*}" = "windows" ]; then ext=".exe"; fi
          cp "${{ matrix.server }}" "staged/store-server-${VERSION}-${PLATFORM}${ext}"
          cp "${{ matrix.cli }}"    "staged/store-cli-${VERSION}-${PLATFORM}${ext}"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform }}
          path: staged
          retention-days: 1

  # ── 5. Manifest and draft release ─────────────────────────────────────
  publish:
    name: publish draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version, build]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: incoming
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: store-web-dist
          path: web-dist

      - name: Write the OTA manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          cp incoming/* dist/

          base="https://github.com/${RELEASES_REPO}/releases/download/v${VERSION}"

          # server.json is what `store-cli update` reads. Same idea as DNC's
          # daemon.json: the client verifies sha256 before swapping anything in,
          # so a truncated download can never become a running binary.
          #
          # Built with a loop rather than a heredoc so adding a platform to the
          # matrix above is the only edit needed.
          platforms=""
          clis=""
          for f in dist/store-server-${VERSION}-*; do
            name=$(basename "$f")
            key=${name#store-server-${VERSION}-}
            key=${key%.exe}
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            platforms="${platforms}    \"${key}\": { \"url\": \"${base}/${name}\", \"sha256\": \"${sha}\" },\n"
          done
          for f in dist/store-cli-${VERSION}-*; do
            name=$(basename "$f")
            key=${name#store-cli-${VERSION}-}
            key=${key%.exe}
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            clis="${clis}    \"${key}\": { \"url\": \"${base}/${name}\", \"sha256\": \"${sha}\" },\n"
          done

          {
            echo '{'
            echo "  \"version\": \"${VERSION}\","
            echo "  \"notes\": \"https://github.com/${RELEASES_REPO}/releases/tag/v${VERSION}\","
            echo "  \"pub_date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo '  "platforms": {'
            printf "%b" "${platforms}" | sed '$ s/,$//'
            echo '  },'
            echo '  "cli": {'
            printf "%b" "${clis}" | sed '$ s/,$//'
            echo '  }'
            echo '}'
          } > dist/server.json

          # Fail loudly rather than publishing a manifest nothing can parse.
          python3 -c "import json,sys; d=json.load(open('dist/server.json')); assert d['platforms'], 'no platforms'; print(json.dumps(d, indent=2))"

          # The web bundle ships embedded in store-server, so there is no
          # separate artifact to install. Archived anyway so a shop can serve it
          # from its own reverse proxy if it ever wants to.
          tar -czf "dist/store-web-${VERSION}.tar.gz" -C web-dist .

          # The deploy scripts, so an installer is one download away.
          tar -czf "dist/deploy-${VERSION}.tar.gz" deploy

          sha256sum dist/* > dist/SHA256SUMS
          ls -l dist

      - name: Publish draft to the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          PUBLISH_NOW: ${{ inputs.publish_immediately }}
        run: |
          set -euo pipefail
          draft_flag="--draft"
          if [ "${PUBLISH_NOW:-false}" = "true" ]; then draft_flag=""; fi

          gh release create "v${VERSION}" \
            --repo "${RELEASES_REPO}" \
            --title "ElectronIx Tool Store ${VERSION}" \
            --notes "Server, CLI and the web terminal (embedded in the server binary), for Linux and Windows.

          **Existing install:**

              store-cli update --apply

          **New install:** unpack \`deploy-${VERSION}.tar.gz\` and run
          \`deploy/linux/install.sh\` or \`deploy/windows/Install-StoreServer.ps1\`.

          The web terminal updates itself: every phone and tablet picks up the new
          bundle on its next load and is offered a reload." \
            $draft_flag \
            dist/*

      - name: Push the tag back (dispatch path only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
