# PR/main checks. Modelled on electronix-dnc's ci.yml — same shape, same
# SHA-pinning discipline — with one deliberate difference: this product's server
# is cross-platform and its terminal is a web app, so the loop runs on Linux.
# DNC pins windows-latest because DNC is a Windows-only desktop product; copying
# that here would double the bill for nothing.

name: CI

# A push to a branch with an open PR used to start a second, identical run:
# `push` matched every branch and `pull_request` matched the PR, and the two
# events land in different concurrency groups (refs/heads/<branch> against
# refs/pull/<n>/merge), so neither cancelled the other. Two runs of the same
# commit, two uploads of an artifact with the same name, and on 2026-09-02 one
# of them answered
#   Failed to FinalizeArtifact: non-retryable (403) Forbidden: Error from
#   intermediary
# eighteen seconds before the other succeeded. That error is GitHub-side and
# does not reproduce on demand, so this is not a proven cure — but the second
# run was doing nothing the first was not, and paying twice for the chance to
# collide with yourself is a bad trade either way.
#
# The cost of the change: a branch pushed with no PR open gets no CI. Every
# change in this repo has gone through one.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pushes to the same branch/PR cancel the older run (unlike
# release.yml, where cancellation is forbidden).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The web terminal. Built first and cached as an artifact, because
  # store-server embeds the bundle and the test job needs it present to check
  # the routes that serve it.
  web:
    name: web terminal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # 22, matching the cloud job below. Was 20, which reached end of life in
      # April 2026 and therefore stops getting security fixes — and the Vite
      # build here does not care which of the two it runs on.
      - name: Install Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/store-web/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: crates/store-web

      - name: typecheck
        run: npm run typecheck
        working-directory: crates/store-web

      # §11's dead-wiring rule, on this side of the workspace. `cloud/` has had
      # this since the port; nothing enforced it here, and ten console routes
      # went in with no screen calling any of them. Reads the router and the
      # client, fails in both directions, needs no database.
      - name: endpoint callers
        run: npm run test:callers
        working-directory: crates/store-web

      - name: build
        run: npm run build
        working-directory: crates/store-web

      - uses: actions/upload-artifact@v7
        with:
          name: store-web-dist
          path: crates/store-web/dist
          retention-days: 1

  # The cloud port: the Next.js app that serves the API and the terminal from
  # Vercel (CLOUD-PORT.md). Independent of `web` — it embeds nothing and needs
  # no artifact — so it runs alongside rather than behind it.
  #
  # It builds with no DATABASE_URL on purpose. Next evaluates route modules
  # while collecting build configuration, so a module that connects at import
  # time fails the build for a database the build never needed to touch. This
  # job is what keeps that true.
  cloud:
    name: cloud (next.js)
    runs-on: ubuntu-latest
    # 15 was enough before M1's gate joined the job. 10 000 ledger ops, each a
    # transaction against the service container, take about two minutes on
    # their own.
    timeout-minutes: 20

    # The end-to-end test needs a real database, for the reason §14 gives: the
    # ledger service, the session machine and the ADMS handler were covered
    # only by the Rust suite testing the *other* implementation of the same
    # rules. Migrations from crates/store-db are the schema of record (§2), so
    # this container runs exactly what Supabase runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: throwaway
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # 22 because the label round-trip test imports a TypeScript module
      # directly under --experimental-strip-types, which landed in 22.6. The
      # `web` job above is on 22 as well now, so this is no longer the odd one
      # out — it is the reason the pair is not 20.
      - name: Install Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: cloud

      - name: typecheck
        run: npm run typecheck
        working-directory: cloud

      # Gated from 2026-09-02. Until then this job ran `typecheck` and not
      # `lint`, and twelve errors accumulated in the three screens over the
      # cloud port — including a `react-hooks/immutability` report that was
      # right, and two `eslint-disable` directives that had stopped
      # suppressing anything. Warnings count too: the three that existed were
      # a stale variable and a ternary used as a statement, and both are the
      # shape that hides a real one.
      - name: lint
        run: npm run lint -- --max-warnings 0
        working-directory: cloud

      - name: build
        run: npm run build
        working-directory: cloud

      # M7's software half for the QR sticker: render the barcode the label
      # actually carries, decode it with an independent reader, and check the
      # payload survives. This test exists because bwip-js renders on a
      # transparent background by default, which flattens to black and decodes
      # as nothing — a label that looks perfect and will not scan.
      - name: label round-trip
        run: npm run test:labels
        working-directory: cloud

      # M8's CSV against a fixture computed by hand. The aggregation is SQL and
      # still needs a database; this covers the rendering, where a comma inside
      # an item description shifts every following column and the file still
      # opens fine.
      - name: consumption report
        run: npm run test:reports
        working-directory: cloud

      # M3's acceptance gate. The session machine is pure, so this needs no
      # database and runs with the rest of the database-free steps. It also
      # covers the derive-on-read rule that replaced the two reapers on Vercel
      # (§10), which has no counterpart in the Rust suite at all.
      - name: session transitions
        run: npm run test:session
        working-directory: cloud

      # §11 says an endpoint with no caller is this project's known failure
      # mode, and until now nothing enforced it — the spec said it and the
      # repository was checked by hand. This reads the route tree and every
      # file that is not a route, and fails on either half of a broken wire: a
      # method exported and referenced nowhere, or a path called and not
      # served. No database and no server, so it runs with the other cheap
      # checks.
      - name: every endpoint has a caller
        run: npm run test:callers
        working-directory: cloud

      # What the terminal says when the server never answered. Three faults —
      # a device with no network, our own deadline, a dropped connection —
      # used to render as one sentence, which is why the 2026-08-29 screenshot
      # could not be diagnosed from the picture. Also pins the policy that a
      # write is attempted exactly once (§7): a POST that threw may already
      # have committed, and a retry is how one issue becomes two ledger rows.
      # No database and no browser — `fetch` and `navigator` are stubbed.
      - name: offline classification
        run: npm run test:offline
        working-directory: cloud

      # From here down the job has a database. Everything above deliberately
      # does not, and the `build` step in particular must stay that way.

      # crates/store-db/migrations is the schema of record for both
      # implementations (§2). Applying it verbatim here is what stops a
      # migration written for one side from never landing on the other.
      - name: migrate
        run: |
          for f in crates/store-db/migrations/*.up.sql; do
            echo "  $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -f "$f" "$DATABASE_URL"
          done
        env:
          DATABASE_URL: postgresql://postgres:throwaway@localhost:5432/store

      # 0008 turned Row Level Security on for the twenty tables that existed
      # when it was written. Postgres has no default that turns it on for the
      # twenty-first, and the deployed database sits behind PostgREST, where a
      # table without RLS is readable and writable with a key designed to live
      # in a browser (CLOUD-PORT.md). A migration that adds a table and forgets
      # the line is therefore a silent hole, and this is what makes it loud.
      - name: every table has RLS
        run: |
          missing=$(psql -tAX "$DATABASE_URL" -c "
            select string_agg(c.relname, ', ' order by c.relname)
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind = 'r'
               and not c.relrowsecurity")
          if [ -n "$missing" ]; then
            echo "::error::tables without RLS: $missing"
            echo "Add 'alter table <name> enable row level security;' to the migration that creates it."
            exit 1
          fi
          echo "  every public table has RLS enabled"
        env:
          DATABASE_URL: postgresql://postgres:throwaway@localhost:5432/store

      # M8's aggregation half, which §13 admitted was verified once by hand and
      # never since. It MUST run before the catalog seed: the report queries
      # aggregate the whole ledger with no item filter, so the seed's opening
      # Preview deployments have no database of their own — the free Supabase
      # tier allows two active projects and both are spoken for — so they run
      # against a `preview` schema inside the production project, selected by
      # DATABASE_SCHEMA. That one variable is the whole of the isolation
      # between a throwaway preview and the real ledger, and §7 forbids
      # deleting a movement that lands in the wrong place.
      - name: preview schema isolation
        run: npm run test:schema
        working-directory: cloud
        env:
          DATABASE_URL: postgresql://postgres:throwaway@localhost:5432/store

      # balances would land in the buckets it is checking. The test asserts
      # that precondition itself, so reordering these steps fails loudly.
      - name: consumption aggregation (empty ledger)
        run: npm run test:reports-db
        working-directory: cloud
        env:
          DATABASE_URL: postgresql://postgres:throwaway@localhost:5432/store

      # M1's acceptance gate: 10 000 random ledger ops, with `item_stock.on_hand`
      # checked against `sum(delta_qty)` after every single one. The Rust suite
      # proves the same rule for the other implementation; nothing until now
      # ran a line of cloud/src/lib/ledger.ts against a trigger.
      - name: ledger property test
        run: npm run test:ledger
        working-directory: cloud
        env:
          DATABASE_URL: postgresql://postgres:throwaway@localhost:5432/store

      # §11: the first admin cannot come from the API, and store-cli needs a
      # Rust toolchain this job does not have. The PIN is piped rather than
      # passed as an argument — an argument lands in the process list.
      - name: bootstrap admin and seed the catalog
        run: |
          echo 1111 | npm run operator -- \
            add --emp-code E1001 --name "CI Admin" --role ADMIN --zk-user-id 1
          npm run seed -- --demo-operators
        working-directory: cloud
        env:
          DATABASE_URL: postgresql://postgres:throwaway@localhost:5432/store

      # M4's acceptance gate, against the deployed code path rather than a
      # mock: punch → claim → issue → on_hand falls → reversal → reconcile.
      # `next start` serves the build produced above.
      #
      # tests/webauthn.mjs and tests/terminal-flow.mjs run in the same step
      # because they need that same server. terminal-flow is the operator's own
      # path — manual sign-in, TAKE OUT, search, quantity, confirm — driven
      # through the screens rather than the API, which is where the two bugs it
      # found were hiding: manual sign-in refused by a constraint added in 0007,
      # and a numeric pad that turned a tap on 2 into a quantity of 12. It drives §8's passkey path end to end against a CDP virtual
      # authenticator — register, sign in, revoke, and prove the revoked
      # credential can no longer open a session. §13 called this "needs a real
      # device on HTTPS"; it needs a real WebAuthn stack, which the runner's
      # Chrome has.
      # `test:write-path` gates the 2026-08-28 outage, where every issue against
      # the deployment hung until Vercel killed the function at 300 s and the
      # terminal read "Saving…" for five minutes. Nothing bounded a query —
      # `connect_timeout` covers opening a connection, not waiting on one
      # already open — so a Supabase config reload that reset the sockets under
      # us produced an infinite wait rather than an error. It asserts the limits
      # `db.ts` sets actually reach the session, and drives a write while reads
      # are in flight, which no other test here does: `e2e.mjs` never has two
      # requests in the air at once.
      # The five below closed the gaps a coverage sweep found, in the order
      # they were written:
      #
      #   test:splits   §11's split issue — one item, several machines, one
      #                 confirm. The path had no test at all, and its claim is a
      #                 §7 claim: the guard applies to the *total*, so a batch
      #                 that overdraws writes nothing rather than serving the
      #                 first two machines.
      #   test:receipt  M6 and M8's cloud half. `POST /txn/receipt` had never
      #                 been exercised against a database, and the OK → LOW →
      #                 EMPTY → OK ladder was only ever checked as report
      #                 arithmetic.
      #   test:expiry   §10's derive-on-read rule through the *routes*.
      #                 `session-transitions.mjs` proves `effectiveState`;
      #                 nothing proved the routes ask it. It found one:
      #                 `touchSession` filtered on the stored `state`, which is
      #                 still ACTIVE for a session that aged out, so a keepalive
      #                 revived a session the API had just refused an issue
      #                 against — exactly the failure §10 names.
      #   test:adms     §9's rules 3 and 4: an unknown user's punch is kept and
      #                 raises a notice, and a device clock six months out (or
      #                 5½ hours ahead) does not age a session, because §10
      #                 measures from the server.
      #   test:insights the six catalog views, the machine drill-down and the
      #                 operator stats. All reads of the ledger rather than
      #                 columns somebody maintains, so the assertions are about
      #                 ordering and membership: a view that ranks wrongly is
      #                 invisible and sends somebody to the wrong bin. It also
      #                 asserts that §7 refuses to let the test delete its own
      #                 fixture rows, which is the trigger doing its job.
      #   test:session-ui  what the console does when it cannot get an answer.
      #                 A 12 h operator token expiring was never noticed: the
      #                 console kept the dead token, kept drawing admin screens,
      #                 and answered every tap with "token is not valid" and no
      #                 way back to the sign-in form. And every panel turned a
      #                 failed request into an empty one — Reports printed
      #                 "Nothing went out in this period" from a fetch that had
      #                 timed out. Both reproduced from screenshots on
      #                 2026-08-30; it fails five ways on the build before them.
      #   test:routes   every GET route, asked once, against the database, with
      #                 the only assertion being that none answers 5xx — which
      #                 is what a renamed column looks like from outside, and
      #                 §14's one remaining coverage gap. Second half is a
      #                 tripwire: a GET route the file does not ask for fails
      #                 the test by name, which is this project's dead-wiring
      #                 failure mode caught at the door.
      #   test:replay   §12's dedup when the replay *races* the attempt it is
      #                 replaying, which is its ordinary shape: fetchOrThrow
      #                 aborts on its own deadline while the request may still
      #                 be in flight, and the terminal re-sends. The stock was
      #                 never wrong — the unique index held — but the second
      #                 caller was told 409, and outbox.ts drops a 409 as
      #                 rejected, so the operator saw a movement that had
      #                 committed reported as failed and re-entered it by hand.
      #   test:paging   both list endpoints answering page two rather than page
      #                 one again. `/stock` read `limit` and ignored `offset`,
      #                 while the terminal's browse-all had been sending one from
      #                 the day it was written — so every "Load more" appended
      #                 the same forty rows and the button could never retire.
      #                 Invisible from both ends: route-smoke asks each GET once
      #                 and a wrong-but-cheerful answer passes it, and
      #                 endpoint-callers proved `/items/browse` had a caller,
      #                 which was true — no screen reached it.
      #   test:throttle the brake in front of the PIN check (0010). Both PIN
      #                 endpoints are public and a PIN is four digits, so the
      #                 assertion that matters is that a *locked* code refuses
      #                 the correct PIN too — a throttle that still verifies has
      #                 slowed nothing down. Moves the clock by backdating rows
      #                 rather than by shortening the window in test builds.
      #   test:admin    §11's two console rules: deactivate never delete, and
      #                 the last active ADMIN cannot leave by either verb. A
      #                 crib whose console nobody can open needs a Rust
      #                 toolchain and the database password to escape.
      #   test:catalog  the catalog's write paths — M7's first step, which had
      #                 no test at all: `route-smoke` asks the GET and
      #                 `endpoint-callers` proves the other four verbs are
      #                 wired, which is not the same as working. It also pins
      #                 the three triggers the route comments claim and nothing
      #                 checked: a new item gets a stock row but *no* alert
      #                 (a catalog import must not raise 500 of them), moving a
      #                 reorder level raises one immediately with no ledger row
      #                 behind it, and an inverted band comes back as a
      #                 sentence. Plus the ack that is not a resolve.
      #   test:serials  everything that ends in a sticker. §6's rule —
      #                 "reprinting is the same number again: print_count
      #                 increments, no new row, no new number" — was one
      #                 `update` nothing exercised, and a reprint that mints
      #                 gives one tool two identities. Also the only test of
      #                 `PUT /admin/printer`, which it uses to check both
      #                 printer modes: BROWSER_PDF records the job DONE with a
      #                 sheet, LAN_AGENT leaves it QUEUED because nothing in
      #                 Vercel's cloud can reach a printer on a private LAN.
      - name: end-to-end
        run: |
          npm run start &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3100/api/v1/version >/dev/null && break
            sleep 1
          done
          npm run test:e2e
          npm run test:write-path
          npm run test:webauthn
          npm run test:terminal
          npm run test:splits
          npm run test:receipt
          npm run test:expiry
          npm run test:adms
          npm run test:admin
          npm run test:catalog
          npm run test:serials
          npm run test:throttle
          npm run test:replay
          npm run test:paging
          npm run test:routes
          npm run test:session-ui
          npm run test:insights
        working-directory: cloud
        env:
          DATABASE_URL: postgresql://postgres:throwaway@localhost:5432/store
          STORE_ENROLMENT_SECRET: ci-enrolment-secret
          STORE_BASE: http://localhost:3100
          PORT: 3100

  # Format and the offline build. Deliberately has no database: this job is what
  # proves the checked-in .sqlx data is current, so a contributor who changes a
  # query without re-running `cargo sqlx prepare` finds out here.
  check:
    name: fmt + clippy (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: web
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5

      # SHA-pinned, following the DNC convention: a moved tag must not be able
      # to swap action code underneath a job. SHAs resolved 2026-08-07.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: actions/download-artifact@v8
        with:
          name: store-web-dist
          path: crates/store-web/dist

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The real work. §14: integration tests run against a real throwaway
  # Postgres, never a mocked database.
  test:
    name: test (postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: electronix_store
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/electronix_store
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: actions/download-artifact@v8
        with:
          name: store-web-dist
          path: crates/store-web/dist

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked

      - name: Run migrations
        run: sqlx migrate run --source crates/store-db/migrations

      # M0's gate. Run explicitly as well as in the test suite, because a
      # migration that cannot be reverted is a migration nobody can back out of
      # at 6pm on a Friday.
      - name: Migrations revert cleanly
        run: |
          sqlx migrate revert --source crates/store-db/migrations --target-version 0
          sqlx migrate run --source crates/store-db/migrations

      - name: cargo test
        run: cargo test --workspace --all-targets --all-features

      - name: Doc tests
        run: cargo test --workspace --doc

      # §7: any drift is a bug. Proving it on an empty database is cheap and
      # catches a broken trigger before it reaches a shop floor.
      - name: Ledger reconciles
        run: cargo run -p store-cli -- reconcile

      # M9: the nightly backup, end to end — dump, restore into a scratch
      # database, compare the ledger against the original, rotate. A backup
      # nobody has ever restored is a hope, not a backup, and this is where we
      # find out it stopped working.
      - name: Backup round-trips
        run: cargo run -p store-cli -- backup --out-dir "$RUNNER_TEMP/backups" --keep 3

      # §12's flow, driven through the actual screens in a real browser.
      #
      # `cargo test` proves the API can do this and cannot prove the terminal
      # does — which is exactly what that cost: the quantity pad used its own
      # default as a prefix, so tapping 2 on a pad showing 1 booked 12, and
      # every API-level test passed throughout, correctly. The API was never
      # asked for 12; the screen sent it.
      #
      # Last in the job because it seeds a catalog, and the two steps above
      # want a database nobody has written to.
      #
      # `tests/cdp.mjs` is dependency-free — it drives Chrome over the DevTools
      # protocol with node built-ins — but it needs a Node with a global
      # WebSocket, which is not the runner's default.
      - name: Install Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Seed a demo catalog
        run: cargo run -p store-cli -- seed --with-stock

      # Built first and then run directly: `cargo run &` backgrounds *cargo*,
      # and killing cargo does not necessarily stop the server it spawned.
      - name: Start store-server
        run: |
          cargo build -p store-server
          ./target/debug/store-server &
          echo $! > "$RUNNER_TEMP/store-server.pid"
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8097/health >/dev/null && exit 0
            sleep 2
          done
          echo "store-server did not come up" >&2
          exit 1
        env:
          STORE_LISTEN: 127.0.0.1:8097
          STORE_ENROLMENT_SECRET: ci-enrolment-secret

      - name: Terminal flow (headless Chrome)
        run: npm run test:terminal
        working-directory: crates/store-web
        env:
          STORE_BASE: http://127.0.0.1:8097
          STORE_ENROLMENT_SECRET: ci-enrolment-secret

      - name: Stop store-server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/store-server.pid")" 2>/dev/null || true

  # M9: the deploy scripts are what a shop actually runs. A syntax error in
  # them is discovered at the worst possible moment otherwise.
  deploy-scripts:
    name: deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: |
          bash -n deploy/linux/install.sh
          bash -n deploy/linux/uninstall.sh
      - name: systemd unit syntax
        run: |
          # The binaries are not installed on the runner, so the only expected
          # complaint is about ExecStart not existing.
          for unit in deploy/linux/*.service deploy/linux/*.timer; do
            out=$(systemd-analyze verify "$unit" 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -v "is not executable" | grep -qi "error\|invalid\|unknown key"; then
              echo "::error::$unit failed verification"
              exit 1
            fi
          done
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem deploy/windows -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
            Write-Host "ok  $($f.Name)"
          }

  # §14: "Keep the raw ADMS capture from M2 as a fixture and replay it in CI
  # forever. When firmware changes, that fixture is how you find out."
  adms-fixtures:
    name: ADMS protocol fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Replay captured device traffic
        run: cargo test -p store-adms

      # M7: a printed label is rastered at print resolution and decoded back by
      # an independent Code 128 reader. No database needed, so it runs here
      # rather than holding up the Postgres job.
      - name: Printed labels scan back
        run: cargo test -p store-label --all-features
